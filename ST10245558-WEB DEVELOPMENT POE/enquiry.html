<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrightSpark Electrical Services | Get a Quote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="emergency-banner">⚡ 24/7 Emergency Electrical Callouts Available</div>

<header>
  <a class="logo" href="index.html" aria-label="BrightSpark Electrical home"><svg class="brand-logo" viewBox="0 0 220 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc"><title id="logoTitle">BrightSpark Electrical logo</title><desc id="logoDesc">A yellow lightning bolt inside a blue circle beside the BrightSpark Electrical name</desc><circle cx="32" cy="32" r="27" fill="#0b2d4d"/><path d="M37 7 18 36h13l-5 21 19-30H32z" fill="#f5b400"/><text x="68" y="29" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#0b2d4d">BrightSpark</text><text x="68" y="47" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#f5b400">Electrical</text></svg></a>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="enquiry.html">Get a Quote</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>
</header>

<div class="hero">
  <h1>Request a Free Quote</h1>
  <p>Tell us about the job and we'll get back to you promptly.</p>
</div>
  <div class="page-image-wrap">
    <img class="page-image" src="https://images.unsplash.com/photo-1621905251918-48416bd8575a?auto=format&fit=crop&w=1400&q=80" alt="Electrician carrying out an electrical repair" loading="eager" decoding="async">
  </div>

<section>
  <form>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="service">Service Needed</label>
    <select id="service" name="service">
      <option>Residential Electrical</option>
      <option>Commercial Electrical</option>
      <option>Light-Industrial Electrical</option>
      <option>Compliance Certificate (CoC)</option>
      <option>Emergency Callout</option>
      <option>Other</option>
    </select>

    <label for="details">Job Details</label>
    <textarea id="details" name="details" rows="5"></textarea>

    <label for="photo">Upload a Photo (optional)</label>
    <input type="file" id="photo" name="photo" accept="image/*">

    <button type="submit" class="btn">Submit Enquiry</button>
  </form>
</section>

<footer>
  <p>BrightSpark Electrical Services (Pty) Ltd &mdash; Johannesburg, Gauteng</p>
  <p>WhatsApp us anytime | <a href="contact.html">Contact Us</a></p>
</footer>

</body>
</html>
